name: tests

# Offline gate: script/workflow syntax + CRLF. The pwhl/ payload tree is large;
# sparse-checkout the code only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tests
            scripts
            .github
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --dev
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check tests
