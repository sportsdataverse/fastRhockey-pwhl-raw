name: tests

# Offline gate: script/workflow syntax + CRLF. The pwhl/ payload tree is large;
# sparse-checkout the code only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # This job runs PR-authored code (`pytest`, plus dependency build
          # hooks under `uv sync`) and pushes nothing, so the checkout token has
          # no reason to stay in .git/config afterwards. Without this, v5's
          # default leaves an `http.https://github.com/.extraheader` credential
          # in the workspace for that code to read (zizmor `artipacked`,
          # CWE-522). Do NOT copy this line into a workflow that commits,
          # pushes, or uploads a release -- those need the persisted credential.
          persist-credentials: false
          # `python` holds the pwhl_raw package the parser tests import
          # (pyproject sets `pythonpath = ["python"]`); without it collection
          # died on `ModuleNotFoundError: No module named 'pwhl_raw'` and the
          # suite had never actually run. The two named payloads are
          # test_flat_parsers.FIXTURE_GIDS -- ~1.4 MB, versus 295 MB for the
          # whole pwhl/json/final tree, so they are listed rather than globbed.
          # Adding a fixture gid means adding it here too; the test says so.
          sparse-checkout: |
            tests
            scripts
            python
            .github
            pyproject.toml
            uv.lock
            pwhl/json/final/18.json
            pwhl/json/final/322.json
          sparse-checkout-cone-mode: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --dev
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check tests
