[project]
name = "pwhl-raw-scrape"
version = "0.1.0"
description = "PWHL raw scraper repo (R scraper; python here only gates scripts + workflows)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E712"]
